name: Build and Push custom airflow image

on:
  workflow_dispatch:

env:
  AIRFLOW_VERSION: 3.2.2
  IMAGE_NAME: ghcr.io/${{ github.repository }}/apache-airflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -f images/airflow/Dockerfile
          --build-arg AIRFLOW_VERSION=$AIRFLOW_VERSION
          -t $IMAGE_NAME:$AIRFLOW_VERSION-${GITHUB_SHA::7} .

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: docker push $IMAGE_NAME:$AIRFLOW_VERSION-${GITHUB_SHA::7}

      - name: Push Docker test image
        if: github.ref == 'refs/heads/images'
        run: docker push $IMAGE_NAME:$AIRFLOW_VERSION-test-${GITHUB_SHA::7}
