name: Build and Push custom airflow image

on:
  workflow_dispatch:

env:
  AIRFLOW_VERSION: ${{ vars.AIRFLOW_VERSION }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}/apache-airflow
  IMAGE_TAG: >-
    ${{ vars.AIRFLOW_VERSION }}${{
      github.ref != 'refs/heads/main' && '-test' || ''
    }}-${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -f images/airflow/Dockerfile \
            --build-arg AIRFLOW_VERSION=${{ env.AIRFLOW_VERSION }} \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/images'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
