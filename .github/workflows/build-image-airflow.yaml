name: Build and Push custom airflow image

on:
  workflow_dispatch:
    inputs:
      airflow_version:
        description: 'Airflow version to build (leave empty to use Dockerfile default)'
        required: false
        type: string

  push:
    branches:
      - main
    paths:
      - 'images/airflow/**'
  release:
    types: [published]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/apache-airflow


permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/reusable-build-image.yaml
    with:
      image: apache-airflow
      dockerfile: images/airflow/Dockerfile
      version_arg: AIRFLOW_VERSION
      version: ${{ inputs.airflow_version }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
