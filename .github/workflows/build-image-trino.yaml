name: Build and Push custom trino image

on:
  workflow_dispatch:

env:
  TRINO_VERSION: 481
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/trino

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -f images/trino/Dockerfile 
          --build-arg TRINO_VERSION=${{ env.TRINO_VERSION }} 
          -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TRINO_VERSION }}-${GITHUB_SHA::7} .

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TRINO_VERSION }}-${GITHUB_SHA::7}
