name: Build and Push custom trino image

on:
  workflow_dispatch:
    inputs:
      trino_version:
        description: 'Trino version to build (leave empty to use Dockerfile default)'
        required: false
        type: string

  push:
    branches:
      - main
    paths:
      - 'images/trino/**'

  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/reusable-build-image.yaml
    with:
      image: trino
      dockerfile: images/trino/Dockerfile
      version_arg: TRINO_VERSION
      version: ${{ inputs.trino_version }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
