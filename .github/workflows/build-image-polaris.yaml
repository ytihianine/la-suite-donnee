name: Build and Push custom apache polaris image

on:
  workflow_dispatch:

env:
  POLARIS_VERSION: ${{ vars.POLARIS_VERSION }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}/apache-polaris
  IMAGE_TAG: >-
    ${{ vars.POLARIS_VERSION }}${{
      github.ref != 'refs/heads/main' && '-test' || ''
    }}-${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -f images/polaris/Dockerfile
          --build-arg POLARIS_VERSION=${{ env.POLARIS_VERSION }}
          -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
