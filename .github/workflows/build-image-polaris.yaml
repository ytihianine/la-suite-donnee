name: Build and Push custom apache polaris image

on:
  workflow_dispatch:
    inputs:
      polaris_version:
        description: 'Polaris version to build (leave empty to use Dockerfile default)'
        required: false
        type: string
  push:
    branches:
      - 'main'
    paths:
      - 'images/polaris/**'
  release:
    types: [published]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/apache-polaris

jobs:
  build:
    uses: ./.github/workflows/reusable-build-image.yaml
    with:
      image: apache-polaris
      dockerfile: images/polaris/Dockerfile
      version_arg: POLARIS_VERSION
      version: ${{ inputs.polaris_version }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
