name: Build and Push custom apache polaris image

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'images/polaris/**'

env:
  POLARIS_VERSION: ${{ vars.POLARIS_VERSION }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}/apache-polaris

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -f images/polaris/Dockerfile
          --build-arg POLARIS_VERSION=${{ env.POLARIS_VERSION }}
          -t ${{ env.IMAGE_NAME }}:${{ env.POLARIS_VERSION }}-${GITHUB_SHA::7} .

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.POLARIS_VERSION }}-${GITHUB_SHA::7}
