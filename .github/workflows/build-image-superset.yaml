name: Build and Push custom Apache Superset image

on:
  workflow_dispatch:
    inputs:
      superset_version:
        description: 'Superset version to build (leave empty to use Dockerfile default)'
        required: false
        type: string

  push:
    branches:
      - 'main'
    paths:
      - 'images/superset/**'
  release:
    types: [published]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/apache-superset

jobs:
  build:
    uses: ./.github/workflows/reusable-build-image.yaml
    with:
      image: apache-superset
      dockerfile: images/superset/Dockerfile
      version_arg: SUPERSET_VERSION
      version: ${{ inputs.superset_version }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
