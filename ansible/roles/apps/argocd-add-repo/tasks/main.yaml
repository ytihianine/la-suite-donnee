---
- name: Add repo to ArgoCD
  ansible.builtin.command:
    'argocd repo add {{ item.url }}
      --name {{ item.name | default("") }} --project {{ item.project | default("") }}
      --username {{ item.username }} --password {{ item.password }}
      --proxy {{ item.proxy | default("") }} --no-proxy {{ item.no_proxy | default("") }}
    '
  loop: "{{ repo | default([]) }}"
