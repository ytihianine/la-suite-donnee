---
- name: Install ArgoCD CLI
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  tasks:
    - name: Check whether ArgoCD CLI is available
      ansible.builtin.shell: command -v argocd
      register: argocd_cli
      changed_when: false
      failed_when: false
      check_mode: false
      become: false

    - name: Skip installation when ArgoCD CLI is already available
      ansible.builtin.meta: end_play
      when: argocd_cli.rc == 0

    - name: Download ArgoCD CLI
      ansible.builtin.get_url:
        url: 'https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64'
        dest: /tmp/argocd-linux-amd64
        mode: '0644'
      become: false

    - name: Install ArgoCD CLI to /usr/local/bin
      ansible.builtin.copy:
        src: /tmp/argocd-linux-amd64
        dest: /usr/local/bin/argocd
        remote_src: true
        mode: '0555'
      become: true

    - name: Remove ArgoCD CLI temp file
      ansible.builtin.file:
        path: /tmp/argocd-linux-amd64
        state: absent
      become: false

    - name: Connect ArgoCD CLI to Kubernetes
      ansible.builtin.command: argocd login --core
      changed_when: false
      become: false
