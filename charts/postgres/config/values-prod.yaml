cnpg-cluster:
  fullnameOverride: db-config-prod
  type: postgresql
  version:
    postgresql: "17"
  cluster:
    instances: 1
    imageName: ghcr.io/cloudnative-pg/postgresql:17.6
    enableSuperuserAccess: true
    superuserSecret: db-config-secret
    initdb:
      database: defaultdb
      owner: pg_admin
      secret:
        name: db-config-app-secret
    storage:
      size: 20Gi
    resources:
      limits:
        cpu: "2"
        memory: 10Gi
      requests:
        cpu: 250m
        memory: 5Gi
