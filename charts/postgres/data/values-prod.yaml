cnpg-cluster:
  fullnameOverride: db-data-prod
  type: postgresql
  version:
    postgresql: "17"
  cluster:
    instances: 1
    imageName: docker.io/bitnamilegacy/postgresql:17.6.0-debian-12-r4
    enableSuperuserAccess: true
    superuserSecret: db-data-secret
    initdb:
      database: defaultdb
      owner: pg_admin
      secret:
        name: db-data-app-secret
    storage:
      size: 20Gi
    resources:
      limits:
        cpu: "2"
        memory: 10Gi
      requests:
        cpu: 250m
        memory: 5Gi
    roles:
      - name: analyst_superset
        ensure: present
        comment: "Utilisateur analyste pour accéder à la base de données métier"
        login: true
        inRoles:
          - pg_read_all_data
        passwordSecret:
          name: db-data-analyst-secret
      - name: airflow_task_writer
        ensure: present
        comment: "Pour les tâches Airflow"
        login: true
        passwordSecret:
          name: db-data-airflow-task-secret
  databases:
    - name: data_store
      ensure: present
      owner: airflow_task_writer
      databaseReclaimPolicy: retain
