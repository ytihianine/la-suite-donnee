redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.0.10-debian-11-r4
  master:
    persistence:
      enabled: false

superset:
  name: superset
  spec:
    environment: Production
    image:
      repository: ghcr.io/ytihianine/la-suite-donnee/apache-superset
      tag: 6.1.0-latest
      pullPolicy: Always
    secretKeyFrom:
      name: superset-secret
      key: SUPERSET_SECRET_KEY
    metastore:
      uriFrom:
        name: superset-secret
        key: METASTORE_URI
    valkey:
      host: superset-redis-master
    webServer:
      replicas: 1
    celeryWorker:
      replicas: 1
    celeryBeat: {}
    networking:
      ingress:
        className: nginx
        host: superset.lab.sspcloud.fr
        annotations:
          argocd.argoproj.io/ignore-healthcheck: "true"
    podTemplate:
      container:
        env:
          - name: SUPERSET_SMTP_HOST
            valueFrom:
              secretKeyRef:
                name: superset-secret
                key: SUPERSET_SMTP_HOST
          - name: SUPERSET_SMTP_STARTTLS
            valueFrom:
              secretKeyRef:
                name: superset-secret
                key: SUPERSET_SMTP_STARTTLS
          - name: SUPERSET_SMTP_SSL
            valueFrom:
              secretKeyRef:
                name: superset-secret
                key: SUPERSET_SMTP_SSL
          - name: SUPERSET_SMTP_USER
            valueFrom:
              secretKeyRef:
                name: superset-secret
                key: SUPERSET_SMTP_USER
          - name: SUPERSET_SMTP_PORT
            valueFrom:
              secretKeyRef:
                name: superset-secret
                key: SUPERSET_SMTP_PORT
          - name: SUPERSET_SMTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: superset-secret
                key: SUPERSET_SMTP_PASSWORD
          - name: SUPERSET_SMTP_MAIL_FROM
            valueFrom:
              secretKeyRef:
                name: superset-secret
                key: SUPERSET_SMTP_MAIL_FROM
          - name: SUPERSET_SMTP_SSL_SERVER_AUTH
            valueFrom:
              secretKeyRef:
                name: superset-secret
                key: SMTP_SSL_SERVER_AUTH
