# Must be ordered to respect app dependencies
steps:
  # ArgoCD
  - name: argocd
    description: "Déployer ArgoCD dans le namespace"
    enable: false
    cmd:
      - "ansible-playbook -i localhost ansible/playbooks/argocd.yaml"
  - name: argocd-cli
    description: "Installer ArgoCD CLI et s'y connecter"
    enable: false
    cmd:
      - "ansible-playbook -i localhost ansible/playbooks/argocd-cli.yaml"
      - "argocd login --core"
  - name: argocd-add-repo
    description: "Ajouter des dépôts GIT dans ArgoCD"
    enable: false
    cmd:
      - "ansible-playbook -i localhost ansible/playbooks/argocd-add-repo.yaml"
  # Renovate Bot
  - name: renovatebot
    description: "Déployer Renovate Bot dans le namespace"
    enable: false
    cmd:
      - "kubectl apply -f argocd/renovatebot/manifest.yaml"
  # Postgres
  - name: db-config
    description: "Déployer la base de données (app config) Postgres"
    enable: false
    cmd:
      - "kubectl apply -f argocd/postgres/config/manifest.yaml"
    wait_app: db-config-prod
  - name: db-data
    description: "Déployer la base de données (app data) Postgres"
    enable: false
    cmd:
      - "kubectl apply -f argocd/postgres/data/manifest.yaml"
    wait_app: db-data-prod
  - name: init-postgres-db
    description: "Initialiser la base de données Postgres"
    enable: false
    cmd:
      - "ansible-playbook -i localhost ansible/playbooks/init-db.yaml"
  # Superset
  - name: superset
    description: "Déployer Superset dans le namespace"
    enable: false
    cmd:
      - "kubectl apply -f argocd/superset/manifest.yaml"
  # Airflow
  - name: airflow
    description: "Déployer Airflow dans le namespace"
    enable: false
    cmd:
      - "kubectl apply -f argocd/airflow/manifest.yaml"
  # Trino
  - name: trino
    description: "Déployer Trino dans le namespace"
    enable: false
    cmd:
      - "kubectl apply -f argocd/trino/manifest.yaml"
  # Polaris
  - name: polaris
    description: "Déployer Polaris dans le namespace"
    enable: false
    cmd:
      - "kubectl apply -f argocd/polaris/manifest.yaml"
