apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-operator
spec:
  destination:
    namespace: projet-mef-sg-dsci
    server: https://kubernetes.default.svc
  source:
    path: argocd/secret-operator
    repoURL: https://github.com/ytihianine/la-suite-donnee.git
    targetRevision: demo-sspcloud
    helm:
      valueFiles:
        - values-prod.yaml
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
