apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: polaris
spec:
  destination:
    namespace: ""
    server: https://kubernetes.default.svc
  source:
    path: argocd/polaris
    repoURL: https://github.com/ytihianine/la-suite-donnee.git
    targetRevision: HEAD
    helm:
      valueFiles:
        - values-prod.yaml
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
