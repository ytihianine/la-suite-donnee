postgresql:
  global:
    postgresql:
      auth:
        # Password for the "postgres" admin user
        # postgresPassword: postgres
        # User to create
        username: pg_admin
        # password: pg_admin
        database: defaultdb
        existingSecret: "db-data-secret"
        secretKeys:
          adminPasswordKey: "POSTGRES_ADMIN_PASSWORD"
          userPasswordKey: "POSTGRES_USER_PASSWORD"
          replicationPasswordKey: "POSTGRES_REPLICATION_PASSWORD"
          metricsPasswordKey: ""

  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.6.0-debian-12-r4

  primary:
    name: main
    resources:
      limits:
        cpu: "2"
        memory: 10Gi
      requests:
        cpu: 250m
        memory: 5Gi
    persistence:
      volumeName: "data"
      size: 20Gi
