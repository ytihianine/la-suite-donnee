postgresql:
  auth:
    username: pg_admin
    database: defaultdb
    existingSecret: "db-config-secret"
    secretKeys:
      adminPasswordKey: "POSTGRES_ADMIN_PASSWORD"
      userPasswordKey: "POSTGRES_USER_PASSWORD"
      replicationPasswordKey: "POSTGRES_REPLICATION_PASSWORD"

  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.6.0-debian-12-r4

  primary:
    name: main
    resources:
      limits:
        cpu: "2"
        memory: 10Gi
      requests:
        cpu: 250m
        memory: 5Gi
    persistence:
      volumeName: "data"
      size: 20Gi
