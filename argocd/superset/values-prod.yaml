superset:

  onyxia:
    friendlyName: superset
    owner: custom
    share: true
    userDefinedValues: ""

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    hosts:
      # The hostname for the web Ingress (templated)
      - superset.lab.sspcloud.fr

  image:
    repository: ghcr.io/ytihianine/apache-superset-custom
    tag: e025702
    pullPolicy: IfNotPresent

  # -- Same as above but the values are files
  configOverridesFiles: {}

  bootstrapScript: |
    #!/bin/bash
    if [ ! -f ~/bootstrap ]; then echo "Running Superset with uid {{ .Values.runAsUser }}" > ~/bootstrap; fi

  init:
    jobAnnotations:
      "helm.sh/hook": post-install,post-upgrade
      "helm.sh/hook-delete-policy": "before-hook-creation"
      "argocd.argoproj.io/hook": Sync
      "argocd.argoproj.io/hook-delete-policy": HookSucceeded
    loadExamples: false
    createAdmin: true
    adminUser:
      firstname: Superset
      lastname: Admin
      email: admin@superset.com
      username: superset_admin
      password: superset_admin

  # -- Superset configuration properties
  # Set any configuration property from superset/config.py here
  # See https://github.com/apache/superset/blob/master/superset/config.py for all available options
  config: {}
    # SECRET_KEY: "supersetSecretKey"
    # ROW_LIMIT: 50000
    # DEBUG: false

  # -- Feature flags configuration
  # See https://github.com/apache/superset/blob/master/RESOURCES/FEATURE_FLAGS.md
  featureFlags: {}
    # ALERT_REPORTS: true
    # DASHBOARD_RBAC: true

  extraSecretEnv:
    SUPERSET_SECRET_KEY: supersetSecretKey

  # -- Database connection configuration for the Superset metadata database
  database:
    # -- Database driver used when uri is not set (default: postgresql+psycopg2 when unset;
    # legacy supersetNode.connections.db_type is honored when this is unset)
    driver: postgresql+psycopg2
    # -- Database host (default: {{ .Release.Name }}-postgresql)
    host: db-config-prod-postgresql
    # -- Database port (default: 5432 when unset; legacy supersetNode.connections.db_port is honored)
    port: 5432
    # -- Database user (default: superset, resolved via superset.db.user)
    user: superset_admin_user
    # -- Database password (default: superset, resolved via superset.db.password)
    # ⚠️ CHANGE THIS for production
    password: superset_password
    # -- Database name (default: superset, resolved via superset.db.name)
    name: superset_config
    # -- Database SSL configuration
    ssl:
      enabled: false
      mode: require

  # -- Redis cache configuration for Superset
  # Redis is optional but recommended for caching and Celery.
  # If redis.enabled (chart dependency) is true, defaults point to the chart's Redis instance.
  cache:
    # -- Enable Redis-based features (cache, Celery). Set to false to disable Redis usage entirely.
    enabled: true


  supersetNode:
    replicas:
      enabled: true
      replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
      # targetMemoryUtilizationPercentage: 80
  ## Set to false if bringing your own PostgreSQL.
  postgresql:
    enabled: false
  # Superset Celery worker configuration
  supersetWorker:
    replicas:
      enabled: true
      replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
      # targetMemoryUtilizationPercentage: 80
    # -- Sets the [pod disruption budget](https://kubernetes.io/docs/tasks/run-application/configure-pdb/) for supersetWorker pods
    resources: {}
