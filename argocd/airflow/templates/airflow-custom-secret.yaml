apiVersion: v1
kind: Secret
metadata:
  name: airflow-custom-secret
type: Opaque
stringData:
  # Security
  fernet-key: verySecureFernetKey
  api-secret-key: verySecureApiSecretKey
  jwt-secret: verySecureJWTToken
  # Config & Metadata database
  # The 'connection' key is a SQLAlchemy connection string, e.g.:
  #   postgresql+psycopg2://user:password@postgres/database
  connection: postgresql+psycopg2://airflow_admin_user:airflow_password@db-config-prod-postgresql/airflow_config
  # Config - API section
  # Must be equal to your ingress.host value
  AIRFLOW__API__BASE_URL: 
  AIRFLOW__API__EXPOSE_CONFIG: "true"
  # Config - Logging section
  AIRFLOW__LOGGING__DELETE_LOCAL_LOGS: "false"
  AIRFLOW__LOGGING__REMOTE_LOGGING: "false"
  AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: "s3://your/key/to/logs"
  AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: "s3_conn"
  # Must config a s3 conn through env var due to issues related to 3.X
  AIRFLOW_CONN_S3_CONN: '{"conn_type":"aws","login":"ACCESS_KEY_ID","password":"SECRET_ACCESS_KEY","extra":{"endpoint_url":"https://s3-instance.fr","region_name":"us-east-1","verify":true}}'
  # Config - SMTP section
  AIRFLOW__SMTP__SMTP_HOST: ""
  AIRFLOW__SMTP__SMTP_PORT: "123"
  AIRFLOW__SMTP__SMTP_MAIL_FROM: "airflow-sg-dsci@interne-rec.finances.gouv.fr"
  AIRFLOW__SMTP__SMTP_STARTTLS: "false"
  AIRFLOW__SMTP__SMTP_SSL: "false"
  # Proxy - Those values are read in constants.py file
  AIRFLOW_PROXY: ""
  AIRFLOW_USER_AGENT: ""
  # Apache polaris & MinIO - Nubonyxia context
  # AWS_ACCESS_KEY_ID: ""
  # AWS_SECRET_ACCESS_KEY: ""
  # AWS_ENDPOINT_URL: ""
  # AWS_DEFAULT_REGION: "us-east-1"
  # GitSync - Only if repository is private and requires HTTP Basic authentication
  #    GIT_SYNC_USERNAME: <base64_encoded_git_username>
  #    GIT_SYNC_PASSWORD: <base64_encoded_git_password>
  #    # For git-sync v4
  #    GITSYNC_USERNAME: <base64_encoded_git_username>
  #    GITSYNC_PASSWORD: <base64_encoded_git_password>

