apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
spec:
  destination:
    namespace: "projet-mef-sg-dsci"
    server: https://kubernetes.default.svc
  source:
    path: argocd/airflow
    repoURL: https://github.com/ytihianine/la-suite-donnee.git
    targetRevision: HEAD
    helm:
      valueFiles:
        - values-prod.yaml
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
